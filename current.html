            "image": "https://cdn.prod.website-files.com/5d79944c26acc6f0a7e96822/671f7e9b8ed014c19117d85e_IDEX-005%402x.webp",
            "desc": "Reverse the turn order",
            "value": "",
            "icons": "INT",
            "elaboration": `Turn reversal takes place AFTER the current player playing resolves their turn when this card is played
For example: there are 3 players in game, Player A, Player B and Player C. The normal turn order goes from A -> B -> C. During Player B's turn, Player A plays Cursed Waters. After Player B completed their turn, the next Player playing will be A, and the turn order becomes B -> A -> C`
        },
        {
            "name": "Eruption",
            "id": "eruption",
            "image": "https://cdn.prod.website-files.com/5d79944c26acc6f0a7e96822/671f7e9bdc109a1581a6b4ff_IDEX-004%402x.webp",
            "desc": "Discard one treasure card. Opponents discard treasure(s) with more than, equal to or closest value of the discarded card",
            "value": "",
            "icons": "ALL, ATK",
            "elaboration": `Return all discarded cards to their respective hands if this card is interrupted`
        },
        {
            "name": "Sacrificial Dagger",
            "id": "sacrificial-dagger",
            "image": "https://cdn.prod.website-files.com/5d79944c26acc6f0a7e96822/671f7e9b088e7302294b7df7_IDEX-007%402x.webp",
            "desc": "When you bury this treasure, you may place piracy cards from your hand underneath. The value of this card is x100 for each piracy card",
            "value": "100x",
            "icons": "",

        },
        {
            "name": "Forbidden Medallion",
            "id": "forbidden-medallion",
            "image": "https://cdn.prod.website-files.com/5d79944c26acc6f0a7e96822/671f7e9b25e184c1e20309e1_IDEX-003%402x.webp",
            "desc": "This treasure cannot be wagered",
            "value": "-400",
            "icons": "",
            "elaboration": `Forbidden Medallion cannot be used to initiate a wager nor to be used when responding to a wager.`
        }
    ]

    var seaMonsterContainer = document.querySelector(".cards-container.sea-monsters")
    seaMonsters.forEach(seaMonster => {
        seaMonsterContainer.appendChild(createCardHolder(seaMonster))
        seaMonsterContainer.appendChild(createOverlay(seaMonster))
    })

    var piracyContainer = document.querySelector(".cards-container.piracy")
    piracys.forEach(piracy => {
        piracyContainer.appendChild(createCardHolder(piracy))
        piracyContainer.appendChild(createOverlay(piracy))
    })

    var treasureContainer = document.querySelector(".cards-container.treasure")
    treasures.forEach(t => {
        treasureContainer.appendChild(createCardHolder(t))
        treasureContainer.appendChild(createOverlay(t))
    })

    var islandOfDoomContainer = document.querySelector(".cards-container.island-of-doom")
    islandOfDoom.forEach(i => {
        islandOfDoomContainer.appendChild(createCardHolder(i))
        islandOfDoomContainer.appendChild(createOverlay(i))
    })

    var characterContainer = document.querySelector(".cards-container.character")
    characters.forEach(c => {
        characterContainer.appendChild(createCardHolder(c))
        characterContainer.appendChild(createOverlay(c))
    })

    function createCardHolder(card) {
        var cardHolder = document.createElement("div")
        cardHolder.className = "card-holder"

        var cardFront = document.createElement("div")
        cardFront.className = "card-front"
        cardFront.style.backgroundImage = `url(${card.image})`
        cardFront.style.backgroundSize = "cover";
        cardFront.style.backgroundPosition = "center";
        cardHolder.appendChild(cardFront)
        return cardHolder
    }

    function divWithClass(className) {
        var div = document.createElement("div")
        div.className = className
        return div
    }

    function divWithClassAsChild(className, parent) {
        var div = divWithClass(className)
        parent.appendChild(div)
        return div
    }

    function piracyCardCopy(title, desc, parent) {
        var heading = document.createElement("h4")
        heading.innerText = title
        heading.className = "rules-section-subheading text-dark sub"
        parent.appendChild(heading)

        var paragraph = document.createElement("p")
        paragraph.innerText = desc
        paragraph.className = "rules-paragraph left-align"
        parent.appendChild(paragraph)
    }

    function createIcon(type) {
        var div = divWithClass("div-block-46")
        var image = document.createElement("img")
        var src = ""
        switch (type) {
            case "SELF":
                src = "https://cdn.prod.website-files.com/5d79944c26acc6f0a7e96822/5f51fbdac3c7a6bd0d0dbd98_self-targeted.png"
                break;
            case "OPPS":
                src = "https://cdn.prod.website-files.com/5d79944c26acc6f0a7e96822/5f51fbcc538d8311c34d32b5_all-oponents.png"
                break;
            case "OPP1":
                src = "https://cdn.prod.website-files.com/5d79944c26acc6f0a7e96822/5f51fa8bb9390a0c9fb9c977_single-opponent.png"
                break;
            case "ALL":
                src = "https://cdn.prod.website-files.com/5d79944c26acc6f0a7e96822/5f51fc61d7e06dc051e6d70e_everyone.png"
                break;
            case "CON":
                src = "https://cdn.prod.website-files.com/5d79944c26acc6f0a7e96822/5f51fd0ab862c99ba2029738_consistent-effect.png"
                break;
            case "ATK":
                src = "https://cdn.prod.website-files.com/5d79944c26acc6f0a7e96822/5f51fcdf91fee3d02f531d1e_actioned-in-turn.png"
                break;
            case "DEF":
                src = "https://cdn.prod.website-files.com/5d79944c26acc6f0a7e96822/5f51fd0ad187a260def39613_actioned-responsively.png"
                break;
            case "INT":
                src = "https://cdn.prod.website-files.com/5d79944c26acc6f0a7e96822/5f51fd0a67c5485beba7b237_interrupt.png"
                break;
        }
        image.src = src
        div.appendChild(image)
        return div
    }

    function createOverlay(card) {
        var cardOverlay = divWithClass("card-overlay")
        var cardInfoModal = divWithClassAsChild("card-info-modal", cardOverlay)
        var cardInfoContent = divWithClassAsChild("card-info-content", cardInfoModal)
        var cardImageAndAmount = divWithClassAsChild("card-image-and-amount", cardInfoContent)
        var imageContainer = divWithClassAsChild("", cardImageAndAmount)
        var cardImage = divWithClassAsChild("", imageContainer)

        cardImage.className = "card-front"
        cardImage.style.backgroundImage = `url(${card.image})`
        cardImage.style.backgroundSize = "cover";
        cardImage.style.backgroundPosition = "center";

        var cardInfo = divWithClassAsChild("card-info", cardInfoContent)
        var cardInfoLeft = divWithClassAsChild("card-info-left", cardInfo)
        var piracyCardNameContainer = divWithClassAsChild("piracy-card-copy", cardInfoLeft)

        piracyCardCopy("Name:", card.name, piracyCardNameContainer)
        if (card.value) {
            piracyCardCopy("Value:", card.value, piracyCardNameContainer)
        }
        if (card.desc) {
            piracyCardCopy("Description:", card.desc, piracyCardNameContainer)
        }

        var cardInfoRight = divWithClassAsChild("card-info-right", cardInfo)
        var piracyDetailsContainer = divWithClassAsChild("piracy-card-copy", cardInfoRight)
        var cardInfoTitleIcons = divWithClassAsChild("card-info-title-and-icons", piracyDetailsContainer)

        // only cards with description have how to play heading, otherwise it's just flavour text
        if (card.desc) {
            // How To Play heading
            var howToPlayHeading = document.createElement("h4")
            var howToPlayText = document.createElement("strong")
            howToPlayText.innerText = "How To Play:"
            howToPlayHeading.appendChild(howToPlayText)
            howToPlayHeading.className = "rules-section-subheading text-dark sub"

            cardInfoTitleIcons.appendChild(howToPlayHeading)
        }

        if (card.icons) {
            card.icons.split(",").forEach(icon => cardInfoTitleIcons.appendChild(createIcon(icon)))
        }

        // add icons
        var elaboration = document.createElement("p")
        elaboration.innerText = card.elaboration
        elaboration.className = "rules-paragraph left-align"

        piracyDetailsContainer.appendChild(elaboration)

        // close button
        var closeButton = divWithClassAsChild("close-button", cardInfoModal)
        var closeButtonImage = document.createElement("img")
        closeButtonImage.src = "https://cdn.prod.website-files.com/5d79944c26acc6f0a7e96822/5f0184fd3eab8733eb827e31_delete.svg"
        closeButton.appendChild(closeButtonImage)

        return cardOverlay
    }

    document.querySelectorAll(".card-holder").forEach(holder => {
        holder.onclick = function () {
            holder.nextElementSibling.style.display = "flex"
        }
    })

    document.querySelectorAll(".close-button").forEach(button => {
        button.onclick = function () {
            button.parentElement.parentElement.style.display = "none"
        }
    })
});

</script>
